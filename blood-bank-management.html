<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Blood Bank Management</title>

<link rel="stylesheet"
href="css/blood-bank-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===========================================
HEALTHCARE HOSPITAL
BLOOD BANK MANAGEMENT
PHASE 1 - PART 1
=========================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-droplet"></i>

Blood Bank Management

</h1>

<p>

Manage blood donations, donors, blood groups, stock availability and blood requests efficiently.

</p>
<!-- ===========================================
ADD BLOOD RECORD FORM
PHASE 1 - PART 2
=========================================== -->

<div class="blood-form">

    <h2>

        <i class="fa-solid fa-plus-circle"></i>

        Add Blood Record

    </h2>

    <form id="bloodForm">

        <div class="form-group">

            <label>Blood Unit ID</label>

            <input
                type="text"
                id="bloodUnitId"
                placeholder="Enter Blood Unit ID"
                required>

        </div>

        <div class="form-group">

            <label>Blood Group</label>

            <select id="bloodGroup" required>

                <option value="">Select Blood Group</option>

                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>

        </div>

        <div class="form-group">

            <label>Donor Name</label>

            <input
                type="text"
                id="donorName"
                placeholder="Enter Donor Name"
                required>

        </div>

        <div class="form-group">

            <label>Donor Contact</label>

            <input
                type="tel"
                id="donorContact"
                placeholder="Enter Donor Contact"
                required>

        </div>

        <div class="form-group">

            <label>Donation Date</label>

            <input
                type="date"
                id="donationDate"
                required>

        </div>

        <div class="form-group">

            <label>Blood Quantity (ml)</label>

            <input
                type="number"
                id="bloodQuantity"
                placeholder="Enter Quantity"
                required>

        </div>

        <div class="form-group">

            <label>Blood Status</label>

            <select id="bloodStatus" required>

                <option value="">Select Status</option>

                <option>Available</option>

                <option>Reserved</option>

                <option>Used</option>

            </select>

        </div>

        <button
            type="submit"
            id="addBloodBtn">

            <i class="fa-solid fa-plus"></i>

            Add Blood Record

        </button>

    </form>

</div>
<!-- ===========================================
SEARCH BLOOD RECORD
PHASE 1 - PART 3
=========================================== -->

<div class="search-box">

    <input
        type="text"
        id="searchBlood"
        placeholder="🔍 Search Blood Record">

</div>

<!-- ===========================================
BLOOD RECORDS TABLE
PHASE 1 - PART 3
=========================================== -->

<div class="table-container">

    <h2>

        <i class="fa-solid fa-table"></i>

        Blood Records

    </h2>

    <table id="bloodTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Blood Unit ID</th>

                <th>Blood Group</th>

                <th>Donor Name</th>

                <th>Donor Contact</th>

                <th>Donation Date</th>

                <th>Quantity (ml)</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <!-- JavaScript will load blood records here -->

        </tbody>

    </table>

</div>

<!-- ===========================================
JAVASCRIPT
=========================================== -->

</div>

<script src="js/blood-bank-management.js"></script>

</body>

</html>
