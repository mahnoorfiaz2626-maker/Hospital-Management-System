<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Inventory Management</title>

<link rel="stylesheet"
href="css/inventory-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===========================================
HEALTHCARE HOSPITAL
INVENTORY MANAGEMENT
PHASE 1 - PART 1
=========================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-boxes-stacked"></i>

Inventory Management

</h1>

<p>

Manage hospital inventory including medicines, equipment, medical supplies, stock levels and suppliers efficiently.

</p>
<!-- ===========================================
ADD INVENTORY ITEM FORM
PHASE 1 - PART 2
=========================================== -->

<div class="inventory-form">

    <h2>

        <i class="fa-solid fa-plus-circle"></i>

        Add Inventory Item

    </h2>

    <form id="inventoryForm">

        <div class="form-group">

            <label>Item ID</label>

            <input
                type="text"
                id="itemId"
                placeholder="Enter Item ID"
                required>

        </div>

        <div class="form-group">

            <label>Item Name</label>

            <input
                type="text"
                id="itemName"
                placeholder="Enter Item Name"
                required>

        </div>

        <div class="form-group">

            <label>Category</label>

            <input
                type="text"
                id="category"
                placeholder="Enter Category"
                required>

        </div>

        <div class="form-group">

            <label>Quantity</label>

            <input
                type="number"
                id="quantity"
                placeholder="Enter Quantity"
                required>

        </div>

        <div class="form-group">

            <label>Unit Price (PKR)</label>

            <input
                type="number"
                id="unitPrice"
                placeholder="Enter Unit Price"
                required>

        </div>

        <div class="form-group">

            <label>Supplier</label>

            <input
                type="text"
                id="supplier"
                placeholder="Enter Supplier Name"
                required>

        </div>

        <div class="form-group">

            <label>Expiry Date</label>

            <input
                type="date"
                id="expiryDate"
                required>

        </div>

        <div class="form-group">

            <label>Stock Status</label>

            <select id="stockStatus" required>

                <option value="">Select Status</option>

                <option>In Stock</option>

                <option>Low Stock</option>

                <option>Out of Stock</option>

            </select>

        </div>

        <button
            type="submit"
            id="addItemBtn">

            <i class="fa-solid fa-plus"></i>

            Add Inventory Item

        </button>

    </form>

</div>
<!-- ===========================================
SEARCH INVENTORY ITEM
PHASE 1 - PART 3
=========================================== -->

<div class="search-box">

    <input
        type="text"
        id="searchInventory"
        placeholder="🔍 Search Inventory Item">

</div>

<!-- ===========================================
INVENTORY RECORDS TABLE
PHASE 1 - PART 3
=========================================== -->

<div class="table-container">

    <h2>

        <i class="fa-solid fa-table"></i>

        Inventory Records

    </h2>

    <table id="inventoryTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Item ID</th>

                <th>Item Name</th>

                <th>Category</th>

                <th>Quantity</th>

                <th>Unit Price</th>

                <th>Supplier</th>

                <th>Expiry Date</th>

                <th>Stock Status</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <!-- JavaScript will load inventory records here -->

        </tbody>

    </table>

</div>

<!-- ===========================================
JAVASCRIPT
=========================================== -->

</div>

<script src="js/inventory-management.js"></script>

</body>

</html>
