<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Department Management</title>

<link rel="stylesheet"
href="css/department-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===========================================
HEALTHCARE HOSPITAL
DEPARTMENT MANAGEMENT
PHASE 1 - PART 1
=========================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-hospital"></i>

Department Management

</h1>

<p>

Manage all hospital departments efficiently.

</p>
<!-- ===========================================
ADD DEPARTMENT FORM
PHASE 1 - PART 2
=========================================== -->

<div class="department-form">

    <h2>

        <i class="fa-solid fa-plus-circle"></i>

        Add New Department

    </h2>

    <form id="departmentForm">

        <div class="form-group">

            <label>Department Name</label>

            <input
                type="text"
                id="departmentName"
                placeholder="Enter Department Name"
                required>

        </div>

        <div class="form-group">

            <label>Head of Department</label>

            <input
                type="text"
                id="headDoctor"
                placeholder="Enter Head Doctor Name"
                required>

        </div>

        <div class="form-group">

            <label>Staff Members</label>

            <input
                type="number"
                id="staffCount"
                placeholder="Enter Total Staff"
                required>

        </div>

        <div class="form-group">

            <label>Location</label>

            <input
                type="text"
                id="location"
                placeholder="Enter Department Location"
                required>

        </div>

        <div class="form-group">

            <label>Contact Number</label>

            <input
                type="tel"
                id="contact"
                placeholder="03XX-XXXXXXX"
                required>

        </div>

        <button
            type="submit"
            id="addDepartmentBtn">

            <i class="fa-solid fa-plus"></i>

            Add Department

        </button>

    </form>

</div>
<!-- ===========================================
SEARCH DEPARTMENT
PHASE 1 - PART 3
=========================================== -->

<div class="search-box">

    <input
        type="text"
        id="searchDepartment"
        placeholder="🔍 Search Department">

</div>

<!-- ===========================================
DEPARTMENT TABLE
PHASE 1 - PART 3
=========================================== -->

<div class="table-container">

    <h2>

        <i class="fa-solid fa-building"></i>

        Department List

    </h2>

    <table id="departmentTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Department Name</th>

                <th>Head of Department</th>

                <th>Staff Members</th>

                <th>Location</th>

                <th>Contact</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <!-- JavaScript will load departments here -->

        </tbody>

    </table>

</div>

<!-- ===========================================
JAVASCRIPT
=========================================== -->

</div>

<script src="js/department-management.js"></script>

</body>
</html>
