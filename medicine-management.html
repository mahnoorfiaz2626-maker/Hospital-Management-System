<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medicine Management</title>

    <link rel="stylesheet"
          href="css/medicine-management.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===========================================
HEALTHCARE HOSPITAL
MEDICINE MANAGEMENT
PHASE 1 - PART 1
=========================================== -->

<div class="container">

    <h1>

        <i class="fa-solid fa-capsules"></i>

        Medicine Management

    </h1>

    <p>

        Manage hospital medicines efficiently.

    </p>
    <!-- ===========================================
ADD MEDICINE FORM
PHASE 1 - PART 2
=========================================== -->

<div class="medicine-form">

    <h2>

        <i class="fa-solid fa-plus-circle"></i>

        Add New Medicine

    </h2>

    <form id="medicineForm">

        <div class="form-group">

            <label>Medicine Name</label>

            <input
                type="text"
                id="medicineName"
                placeholder="Enter Medicine Name"
                required>

        </div>

        <div class="form-group">

            <label>Category</label>

            <select id="category" required>

                <option value="">Select Category</option>

                <option>Tablet</option>

                <option>Capsule</option>

                <option>Syrup</option>

                <option>Injection</option>

                <option>Ointment</option>

            </select>

        </div>

        <div class="form-group">

            <label>Company</label>

            <input
                type="text"
                id="company"
                placeholder="Enter Company Name"
                required>

        </div>

        <div class="form-group">

            <label>Price (Rs.)</label>

            <input
                type="number"
                id="price"
                placeholder="Enter Price"
                required>

        </div>

        <div class="form-group">

            <label>Stock Quantity</label>

            <input
                type="number"
                id="stock"
                placeholder="Enter Stock Quantity"
                required>

        </div>

        <div class="form-group">

            <label>Expiry Date</label>

            <input
                type="date"
                id="expiryDate"
                required>

        </div>

        <button
            type="submit"
            id="addMedicineBtn">

            <i class="fa-solid fa-plus"></i>

            Add Medicine

        </button>

    </form>

</div>
<!-- ===========================================
SEARCH MEDICINE
PHASE 1 - PART 3
=========================================== -->

<div class="search-box">

    <input
        type="text"
        id="searchMedicine"
        placeholder="🔍 Search Medicine">

</div>

<!-- ===========================================
MEDICINE TABLE
PHASE 1 - PART 3
=========================================== -->

<div class="table-container">

    <h2>

        <i class="fa-solid fa-table"></i>

        Medicine List

    </h2>

    <table id="medicineTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Medicine Name</th>

                <th>Category</th>

                <th>Company</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Expiry Date</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <!-- JavaScript will load medicines here -->

        </tbody>

    </table>

</div>

<!-- ===========================================
JAVASCRIPT
=========================================== -->

</div>

<script src="js/medicine-management.js"></script>

</body>

</html>
