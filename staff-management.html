<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Staff Management</title>

<link rel="stylesheet"
href="css/staff-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===========================================
HEALTHCARE HOSPITAL
STAFF MANAGEMENT
PHASE 1 - PART 1
=========================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-users"></i>

Staff Management

</h1>

<p>

Manage hospital staff members, departments and employee records efficiently.

</p>
<!-- ===========================================
ADD STAFF FORM
PHASE 1 - PART 2
=========================================== -->

<div class="staff-form">

    <h2>

        <i class="fa-solid fa-plus-circle"></i>

        Add New Staff

    </h2>

    <form id="staffForm">

        <div class="form-group">

            <label>Staff ID</label>

            <input
                type="text"
                id="staffId"
                placeholder="Enter Staff ID"
                required>

        </div>

        <div class="form-group">

            <label>Staff Name</label>

            <input
                type="text"
                id="staffName"
                placeholder="Enter Staff Name"
                required>

        </div>

        <div class="form-group">

            <label>Designation</label>

            <select id="designation" required>

                <option value="">Select Designation</option>

                <option>Receptionist</option>

                <option>Pharmacist</option>

                <option>Accountant</option>

                <option>Lab Technician</option>

                <option>Cleaner</option>

                <option>Security Guard</option>

                <option>IT Support</option>

            </select>

        </div>

        <div class="form-group">

            <label>Department</label>

            <select id="department" required>

                <option value="">Select Department</option>

                <option>Administration</option>

                <option>Accounts</option>

                <option>Pharmacy</option>

                <option>Laboratory</option>

                <option>Emergency</option>

                <option>IT</option>

                <option>Maintenance</option>

            </select>

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter Phone Number"
                required>

        </div>

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email Address"
                required>

        </div>

        <div class="form-group">

            <label>Salary (Rs.)</label>

            <input
                type="number"
                id="salary"
                placeholder="Enter Salary"
                required>

        </div>

        <button
            type="submit"
            id="addStaffBtn">

            <i class="fa-solid fa-plus"></i>

            Add Staff

        </button>

    </form>

</div>
<!-- ===========================================
SEARCH STAFF
PHASE 1 - PART 3
=========================================== -->

<div class="search-box">

    <input
        type="text"
        id="searchStaff"
        placeholder="🔍 Search Staff">

</div>

<!-- ===========================================
STAFF TABLE
PHASE 1 - PART 3
=========================================== -->

<div class="table-container">

    <h2>

        <i class="fa-solid fa-table"></i>

        Staff List

    </h2>

    <table id="staffTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Staff ID</th>

                <th>Name</th>

                <th>Designation</th>

                <th>Department</th>

                <th>Phone</th>

                <th>Email</th>

                <th>Salary</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <!-- JavaScript will load staff here -->

        </tbody>

    </table>

</div>

<!-- ===========================================
JAVASCRIPT
=========================================== -->

</div>

<script src="js/staff-management.js"></script>

</body>

</html>
