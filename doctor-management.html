<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Doctor Management</title>

<link rel="stylesheet"
href="css/doctor-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ======================================
DOCTOR MANAGEMENT
====================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-user-doctor"></i>

Doctor Management

</h1>

<p>

Manage hospital doctors easily.

</p>
<!-- ======================================
ADD DOCTOR FORM
====================================== -->

<div class="doctor-form">

<h2>

<i class="fa-solid fa-user-plus"></i>

Add New Doctor

</h2>

<form id="doctorForm">

<div class="form-group">

<label>Doctor Name</label>

<input
type="text"
id="doctorName"
placeholder="Enter Doctor Name"
required>

</div>

<div class="form-group">

<label>Department</label>

<select id="department" required>

<option value="">Select Department</option>

<option>Cardiology</option>

<option>Neurology</option>

<option>Pediatrics</option>

<option>Orthopedic</option>

<option>Dental</option>

<option>Ophthalmology</option>

</select>

</div>

<div class="form-group">

<label>Experience</label>

<input
type="text"
id="experience"
placeholder="Example: 10 Years"
required>

</div>

<div class="form-group">

<label>Phone</label>

<input
type="text"
id="phone"
placeholder="03XXXXXXXXX"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="doctor@hospital.com"
required>

</div>

<div class="form-group">

<label>Consultation Fee</label>

<input
type="number"
id="fee"
placeholder="3000"
required>

</div>

<div class="form-group">

<label>Status</label>

<select id="status">

<option>Available</option>

<option>Busy</option>

<option>On Leave</option>

</select>

</div>

<div class="form-group">

<label>Doctor Image</label>

<input
type="file"
id="doctorImage"
accept="image/*">

</div>

<button
type="submit"
id="addDoctorBtn">

<i class="fa-solid fa-plus"></i>

Add Doctor

</button>

</form>

</div>
<!-- ======================================
SEARCH DOCTOR
====================================== -->

<div class="search-box">

<input
type="text"
id="searchDoctor"
placeholder="🔍 Search Doctor">

</div>

<!-- ======================================
DOCTORS TABLE
====================================== -->

<div class="table-container">

<h2>

<i class="fa-solid fa-table"></i>

Doctors List

</h2>

<table id="doctorTable">

<thead>

<tr>

<th>ID</th>

<th>Image</th>

<th>Name</th>

<th>Department</th>

<th>Experience</th>

<th>Phone</th>

<th>Email</th>

<th>Fee</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<!-- JavaScript will load doctors here -->

</tbody>

</table>

</div>
</div>

<script src="js/doctor-management.js"></script>

</body>

</html>
