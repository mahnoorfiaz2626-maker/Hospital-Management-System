<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>User Management</title>

<link rel="stylesheet"
href="css/user-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===========================================
HEALTHCARE HOSPITAL
USER / ADMIN MANAGEMENT
PHASE 1 - PART 1
=========================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-users-gear"></i>

User / Admin Management

</h1>

<p>

Manage hospital users, administrators, doctors, receptionists and staff accounts with secure role-based access.

</p>
<!-- ===========================================
ADD USER FORM
PHASE 1 - PART 2
=========================================== -->

<div class="user-form">

    <h2>

        <i class="fa-solid fa-user-plus"></i>

        Add New User

    </h2>

    <form id="userForm">

        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter Full Name"
                required>

        </div>

        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                required>

        </div>

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email Address"
                required>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

        </div>

        <div class="form-group">

            <label>Contact Number</label>

            <input
                type="tel"
                id="contact"
                placeholder="Enter Contact Number"
                required>

        </div>

        <div class="form-group">

            <label>Role</label>

            <select id="role" required>

                <option value="">Select Role</option>

                <option>Admin</option>

                <option>Doctor</option>

                <option>Receptionist</option>

                <option>Staff</option>

            </select>

        </div>

        <div class="form-group">

            <label>Status</label>

            <select id="status" required>

                <option value="">Select Status</option>

                <option>Active</option>

                <option>Inactive</option>

            </select>

        </div>

        <button
            type="submit"
            id="addUserBtn">

            <i class="fa-solid fa-plus"></i>

            Add User

        </button>

    </form>

</div>
<!-- ===========================================
SEARCH USER
PHASE 1 - PART 3
=========================================== -->

<div class="search-box">

    <input
        type="text"
        id="searchUser"
        placeholder="🔍 Search User">

</div>

<!-- ===========================================
USERS TABLE
PHASE 1 - PART 3
=========================================== -->

<div class="table-container">

    <h2>

        <i class="fa-solid fa-users"></i>

        User Records

    </h2>

    <table id="userTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Full Name</th>

                <th>Username</th>

                <th>Email</th>

                <th>Contact</th>

                <th>Role</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <!-- JavaScript will load user records here -->

        </tbody>

    </table>

</div>

<!-- ===========================================
JAVASCRIPT
=========================================== -->

</div>

<script src="js/user-management.js"></script>

</body>

</html>
