<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patient Management</title>

<link rel="stylesheet"
href="css/patient-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ======================================
PATIENT MANAGEMENT
PHASE 1 - PART 1
====================================== -->

<div class="container">

<h1>

<i class="fa-solid fa-hospital-user"></i>

Patient Management

</h1>

<p>

Manage hospital patients easily.

</p>
<!-- ======================================
ADD PATIENT FORM
PHASE 1 - PART 2
====================================== -->

<div class="patient-form">

<h2>

<i class="fa-solid fa-user-plus"></i>

Add New Patient

</h2>

<form id="patientForm">

<div class="form-group">

<label>Patient Name</label>

<input
type="text"
id="patientName"
placeholder="Enter Patient Name"
required>

</div>

<div class="form-group">

<label>Age</label>

<input
type="number"
id="age"
placeholder="Enter Age"
required>

</div>

<div class="form-group">

<label>Gender</label>

<select id="gender" required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="form-group">

<label>Disease</label>

<input
type="text"
id="disease"
placeholder="Enter Disease"
required>

</div>

<div class="form-group">

<label>Assigned Doctor</label>

<select id="doctor" required>

<option value="">Select Doctor</option>

<option>Dr. Aleeza</option>

<option>Dr. Tehreem</option>

<option>Dr. Mahnoor</option>

<option>Dr. Ahmed</option>

<option>Dr. Fatima</option>

<option>Dr. Usman</option>

</select>

</div>

<div class="form-group">

<label>Phone</label>

<input
type="text"
id="phone"
placeholder="03XXXXXXXXX"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="patient@email.com"
required>

</div>

<div class="form-group">

<label>Admission Date</label>

<input
type="date"
id="admissionDate"
required>

</div>

<div class="form-group">

<label>Status</label>

<select id="status">

<option>Admitted</option>

<option>Discharged</option>

<option>Under Treatment</option>

</select>

</div>

<button
type="submit"
id="addPatientBtn">

<i class="fa-solid fa-plus"></i>

Add Patient

</button>

</form>

</div>
<!-- ======================================
SEARCH PATIENT
PHASE 1 - PART 3
====================================== -->

<div class="search-box">

<input
type="text"
id="searchPatient"
placeholder="🔍 Search Patient">

</div>

<!-- ======================================
PATIENTS TABLE
PHASE 1 - PART 3
====================================== -->

<div class="table-container">

<h2>

<i class="fa-solid fa-table"></i>

Patients List

</h2>

<table id="patientTable">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Age</th>

<th>Gender</th>

<th>Disease</th>

<th>Doctor</th>

<th>Phone</th>

<th>Email</th>

<th>Admission Date</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<!-- JavaScript will load patients here -->

</tbody>

</table>

</div>
</div>

<script src="js/patient-management.js"></script>

</body>

</html>
